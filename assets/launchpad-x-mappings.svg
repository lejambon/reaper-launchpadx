<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="750" viewBox="0 0 1080 750" role="img" aria-labelledby="title desc">
<title id="title">Launchpad X Session mixer button mappings</title>
<desc id="desc">Columns map to tracks 1 through 8. Rows 1 through 5 are dark and unassigned. Row 6 toggles mute, white when unmuted and red when muted. Row 7 toggles solo, amber when active. Row 8 toggles audio record arm in pink or exclusive Note target and arm in purple. Right Pan toggles master mono L+R, blue for mono and white for stereo. Right Mute toggles master mute, red when muted and white when unmuted. Missing tracks, inactive solo and unarmed tracks are dark.</desc>
<rect width="1080" height="750" rx="18" fill="#f4f6fa"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033} .label{font-size:18px;font-weight:700}.detail{font-size:16px;fill:#4a5568}.small{font-size:11px;fill:#c4cbd6}.number{font-size:15px;fill:#aab4c5;text-anchor:middle}.leader{fill:none;stroke:#8592a6;stroke-width:2}</style>
<text x="36" y="43" font-size="26" font-weight="700">Launchpad X · Session mixer</text>
<text x="36" y="72" class="detail">Tracks 1–8 from left to right · rows count from the top</text>
