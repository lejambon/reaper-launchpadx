<text x="36" y="858" class="detail">Session only · rows 1–5, Send A, Capture MIDI and arrows are unassigned.</text>
<text x="36" y="888" class="detail">Example: stopped at start, repeat and mono on. Send B and Stop Clip are off.</text>
<text x="36" y="918" class="detail">Missing tracks and unarmed pads are dark. Transport preserves the active Note target.</text>
