<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940" role="img" aria-labelledby="title desc">
<title id="title">Launchpad X Session mixer and transport mappings</title>
<desc id="desc">Columns map to tracks 1 through 8. Rows 1 through 5 are dark. Row 6 toggles track mute, dim white off and red on. Row 7 toggles track solo, dim white off and amber on. Row 8 selects and arms a Note target in purple or toggles audio arm in pink. Volume records, red steady or pulsing while recording. Pan plays or pauses, green steady when stopped, pulsing when playing and amber when paused. Send B goes to project start only when stopped away from start, bright white when available and off otherwise. Stop Clip stops transport, off when stopped. Mute toggles master mute with red on and dim white off, Solo toggles repeat with green on and dim white off, and Record Arm toggles master mono with amber on and dim white off. Send A, Capture MIDI and arrows are unassigned. Missing tracks and unarmed pads are dark.</desc>
<rect width="1280" height="940" rx="18" fill="#f4f6fa"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033} .label{font-size:18px;font-weight:700}.detail{font-size:16px;fill:#4a5568}.small{font-size:11px;fill:#c4cbd6}.number{font-size:15px;fill:#aab4c5;text-anchor:middle}.leader{fill:none;stroke:#8592a6;stroke-width:2}</style>
